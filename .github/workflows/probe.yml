name: probe-nol
on:
  push:
    branches: [probe-nol]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python probe/probe.py > probe/out.txt 2>&1 || true
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/out.txt; git commit -m "probe out [skip ci]" || true; git push
